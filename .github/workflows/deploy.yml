name: Deploy to GitHub Pages

on:
  push:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Build static export
        env:
          # `public/CNAME` is committed, so next.config.ts resolves the base
          # path to "" (custom domain served from the root). `BASE_PATH` can
          # still override it, e.g. to preview the `/portfolio` sub-path.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          # Origin of the API, without `/api`: every fetch and every image goes
          # through it (`/api/projects`, `/api/assets/logos/...`).
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.hactazia.fr' }}
          # Presence (live cursors) does not live under `/api`; it needs its own
          # URL when the API is on another host.
          NEXT_PUBLIC_WS_URL: ${{ vars.WS_URL || 'wss://api.hactazia.fr/ws' }}
        run: |
          if [ -n "$NEXT_PUBLIC_BASE_PATH" ]; then
            export NEXT_PUBLIC_BASE_PATH
          else
            unset NEXT_PUBLIC_BASE_PATH   # let next.config.ts auto-detect
          fi
          pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

