name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Build static export
        env:
          # Base path is auto-detected from the repository name.
          # Set `BASE_PATH` (repo variable) to override, e.g. `/` for a
          # custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          # Origin of the API, without `/api`. Leave the variable unset to keep
          # the demo data fallback.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$NEXT_PUBLIC_BASE_PATH" ]; then
            export NEXT_PUBLIC_BASE_PATH
          else
            unset NEXT_PUBLIC_BASE_PATH   # let next.config.ts auto-detect
          fi
          pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
