services:
  backend:
    image: node:22-alpine
    working_dir: /workspace
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:3001
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
    command: sh -c "corepack enable && pnpm install && pnpm --filter @portfolio/common build && pnpm --filter backend start:dev"
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - '3001:3000'
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
    command: sh -c "corepack enable && pnpm install && pnpm --filter @portfolio/common build && pnpm --filter frontend dev"
    depends_on:
      - backend

volumes:
  pnpm-store:
