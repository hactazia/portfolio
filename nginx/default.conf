# Upstream API. Use `api:3000` with the bundled sample service, or any host
# reachable from this container, e.g. `http://host.docker.internal:4000`.
# It is declared as a variable so nginx still boots when the API is absent.
map $host $api_upstream {
  default "api:3000";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # Docker's embedded DNS, required to resolve the upstream at request time.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ---------------------------------------------------------------------
  # API proxy: the frontend always calls the same origin under /api.
  # ---------------------------------------------------------------------
  location /api/ {
    set $upstream $api_upstream;
    proxy_pass http://$upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffering off;
  }

  # ---------------------------------------------------------------------
  # Static export (Next.js `trailingSlash: true` -> `/foo/` = `/foo/index.html`)
  # ---------------------------------------------------------------------
  location / {
    try_files $uri $uri/index.html $uri.html $uri/ /404.html;
  }

  # Long-lived cache for hashed assets.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /404.html {
    internal;
  }

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
